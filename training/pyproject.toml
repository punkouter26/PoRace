[project]
name = "porace-training"
version = "0.1.0"
description = "PoRace Go2 RL training on MuJoCo Warp (mujoco_playground + Brax PPO)"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.15.0",
    "mujoco-warp==3.15.0",
    "playground==0.2.0",
    "brax==0.14.2",
    "jax[cuda13]==0.11.2",
    "onnx==1.23.2",
    "onnxruntime==1.30.0",
    "tensorboard>=2.19",
    "ml-collections>=1.0",
    "tensorboardX>=2.6",
]

[tool.uv]
package = false
